<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Motor driver Skill Brick</title>
  <link rel="stylesheet" href="skill-brick.css" />
  <style>
    .chooser {
      width: min(46rem, calc(100% - 2rem));
      margin: 2.5rem auto;
      padding: 2rem;
      display: grid;
      grid-template-columns: 11rem 1fr;
      gap: 2rem;
      align-items: center;
      border-left: 0.5rem solid var(--accent);
      border-radius: 0.65rem;
      background: #ffffff;
      box-shadow: 0 0.2rem 0.75rem rgb(0 0 0 / 9%);
    }
    .chooser-image img { display: block; width: 100%; height: auto; }
    .chooser-strand {
      margin: 0 0 0.4rem;
      color: var(--accent-ink);
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .chooser h1 { margin: 0 0 0.6rem; font-size: 2.2rem; }
    .chooser p { margin: 0 0 1rem; font-size: 1rem; }
    .chooser-list { margin: 0 0 1.2rem; padding: 0; list-style: none; display: grid; gap: 0.6rem; }
    .chooser-list li { display: flex; gap: 0.6rem; align-items: stretch; }
    .chooser-list a {
      border-radius: 0.6rem;
      color: inherit;
      text-decoration: none;
    }
    .chooser-card {
      flex: 1;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.75rem 1rem;
      border: 0.12rem solid var(--accent-line);
      background: var(--accent-wash);
    }
    .chooser-card strong { font-size: 1.1rem; }
    .chooser-card span { color: var(--muted); font-size: 0.9rem; }
    .chooser-pdf {
      display: flex;
      align-items: center;
      padding: 0 1rem;
      color: #ffffff !important;
      background: var(--accent-ink);
      font-weight: 700;
    }
    .chooser-list a:hover,
    .chooser-list a:focus-visible { outline: 0.18rem solid var(--accent); outline-offset: 0.15rem; }
    .chooser-home a { color: var(--accent-ink); font-weight: 700; }
    @media (max-width: 36rem) {
      .chooser { grid-template-columns: 1fr; }
      .chooser-image { width: 8rem; }
      .chooser-card { flex-direction: column; gap: 0.15rem; }
    }
  </style>
</head>
<body class="strand-do">
  <main class="chooser">
    <div class="chooser-image">      <img src="images/component-motor-driver.png" alt="An L293D sixteen-pin motor driver integrated circuit" />    </div>
    <div>
      <p class="chooser-strand">Do &middot; Build Lab Skill Brick</p>
      <h1>Motor driver</h1>
      <p>Choose the card for your board.</p>
      <ul class="chooser-list">        <li>
          <a class="chooser-card" href="motor-driver-blocks.html"><strong>Pico blocks</strong><span>MicroLab blocks</span></a>
          <a class="chooser-pdf" href="motor-driver-blocks.pdf" download aria-label="Pico blocks card as PDF">PDF</a>
        </li>        <li>
          <a class="chooser-card" href="motor-driver-pico.html"><strong>Pico</strong><span>MicroPython</span></a>
          <a class="chooser-pdf" href="motor-driver-pico.pdf" download aria-label="Pico card as PDF">PDF</a>
        </li>        <li>
          <a class="chooser-card" href="motor-driver-pi.html"><strong>Raspberry Pi</strong><span>Python</span></a>
          <a class="chooser-pdf" href="motor-driver-pi.pdf" download aria-label="Raspberry Pi card as PDF">PDF</a>
        </li>      </ul>
      <p class="chooser-home"><a href="../index.html">All Skill Bricks</a></p>
    </div>
  </main>
</body>
</html>
